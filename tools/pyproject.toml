[project]
name = "s300-reset-tool"
version = "1.0.0"
description = "S300 Software Reset Control Tool"
authors = [{ name = "S300 BSP Team", email = "support@s300.dev" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
    "requests>=2.25.0",
    "click>=8.0.0",
    "rich>=12.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=22.0.0", "flake8>=4.0.0", "mypy>=0.950"]

[project.scripts]
s300-reset = "s300_reset_tool:main"
s300-ota = "s300_ota_tool:main"
s300-monitor = "serial_monitor:main"

[project.urls]
Homepage = "https://github.com/s300-bsp/reset-tool"
Repository = "https://github.com/s300-bsp/reset-tool.git"
Issues = "https://github.com/s300-bsp/reset-tool/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
