[project]
name = "s300-tools"
version = "1.0.0"
description = "S300 BSP PC Tools"
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
    "colorama>=0.4.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=22.0.0"]

[project.scripts]
bus-servo-test = "bus_servo_test:main"
bus-servo-gui = "bus_servo_gui:main"
gimbal-control = "gimbal_control:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
